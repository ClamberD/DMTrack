name: "DINOv2/B-378"

logging:
  category: "DMTrack"
  tags:
    - "DINOv2"
    - "base"
    - "378"
    - "TMoE"

type: "DMTrack"

common:
  template_size: [ 196, 196 ]
  search_region_size: [ 378, 378 ]
  template_feat_size: [ 14, 14 ]
  search_region_feat_size: &search_region_feat_size [ 27, 27 ]
  response_map_size: *search_region_feat_size
  template_feat_data_layout: "NLC"
  interpolation_mode: "bilinear"
  interpolation_align_corners: false
  normalization: "imagenet"

model:
  template_feat_size: [14, 14]
  type: "dinov2"
  backbone:
    type: "DINOv2"
    parameters:
      name: "ViT-B/14"
      acc: "default"
      use_moe: false

  camoe:
    r: 64
    alpha: 64
    dropout: 0.
    use_rsexpert: false
    init_method: "bert"
    n_routed_experts: 4
    n_shared_experts: 1
    n_activated_experts: 1
    score_func: "softmax"
    route_scale: 1.0
    use_load_balance: true
    lfb_momentum: 0.9
    router_norm: "rmsnorm"
    lfb_update_rate: 0.0001

run: !include "../run.yaml"
